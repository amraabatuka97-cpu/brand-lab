<!doctype html>
<html lang="mn" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d14"><meta name="description" content="Анхаарал, ой тогтоолт, хариу үйлдлийн хурдыг судлах интерактив тоглоомууд.">
<title>Brain Lab — Тархины лаборатори</title>
<style>* {
  box-sizing: border-box;
}
html {
  color-scheme: dark;
  scroll-behavior: smooth;
  --bg: #0a0d14;
  --panel: #111620;
  --raised: #1a202e;
  --line: #293040;
  --txt: #f3f4fa;
  --muted: #a1a9bc;
  --violet: #ac91ff;
  --nav: #10131c;
  --soft: #221e35;
}
html[data-theme=light] {
  color-scheme: light;
  --bg: #f3f4fa;
  --panel: #fff;
  --raised: #edf0f7;
  --line: #d4d9e6;
  --txt: #171b2e;
  --muted: #556078;
  --violet: #6541bb;
  --nav: #fafbff;
  --soft: #ede8fc;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font: 16px/1.52 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing: antialiased;
}
button,input,select {
  font: inherit;
}
button,select {
  cursor: pointer;
}
button {
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: .5;
}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible {
  outline: 3px solid #ae99ff;
  outline-offset: 4px;
}
button {
  transition: background .18s,transform .18s,border-color .18s;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
a {
  color: var(--violet);
}
h1,h2,h3,p {
  margin: 0;
}
h1,h2,h3 {
  line-height: 1.17;
  letter-spacing: -.035em;
}
h1 {
  font-size: clamp(2.2rem,4.3vw,3.8rem);
}
h2 {
  font-size: clamp(1.45rem,2.2vw,1.9rem);
}
h3 {
  font-size: 1.28rem;
}
p {
  color: var(--muted);
}
svg {
  width: 1.18em;
  height: 1.18em;
  display: block;
  flex-shrink: 0;
}
i[data-icon],.ico {
  display: inline-flex;
  font-style: normal;
  align-items: center;
}
header {
  border-bottom: 1px solid var(--line);
  background: var(--nav);
}
.bar,main,footer {
  width: min(calc(100% - 6.6vw),1336px);
  margin: auto;
}
.bar {
  min-height: 72px;
  display: flex;
  align-items: center;
  gap: clamp(1rem,5.3vw,6rem);
}
.brand {
  display: flex;
  align-items: center;
  font-weight: 750;
  font-size: 1.48rem;
  letter-spacing: -.056em;
  white-space: nowrap;
  padding: 0;
  gap: .2em;
}
.brand>span:last-child {
  color: var(--violet);
}
.logo {
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#7251e2,#42217b);
  border: 1px solid #a88aff88;
  border-radius: 11px;
  width: 37px;
  height: 37px;
  color: #ede5ff;
  margin-right: .28em;
  box-shadow: inset 0 0 12px #ac8dff3b;
}
.logo svg {
  width: 26px;
  height: 26px;
}
nav,.account {
  display: flex;
  align-items: center;
  gap: 6px;
}
nav button,.profile,.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 550;
  font-size: .88rem;
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--muted);
  white-space: nowrap;
}
nav button:hover,.iconbtn:hover,.profile:hover {
  background: var(--raised);
  color: var(--txt);
}
nav button.active {
  color: var(--violet);
  background: var(--soft);
}
.account {
  margin-left: auto;
}
.divider {
  height: 23px;
  border-left: 1px solid var(--line);
  margin: 0 7px;
}
.profile {
  color: var(--txt);
  padding: 6px 3px;
  max-width: 140px;
}
.profile i {
  background: var(--soft);
  color: var(--violet);
  width: 31px;
  height: 31px;
  border-radius: 50%;
  justify-content: center;
}
.profile span {
  overflow: hidden;
  text-overflow: ellipsis;
}
.iconbtn {
  padding: 9px;
}
main {
  padding: 26px 0 40px;
  min-height: calc(100vh - 152px);
}
.hero {
  isolation: isolate;
  position: relative;
  overflow: hidden;
  background: #101021;
  color: #f7f6ff;
  border: 1px solid #3a3352;
  border-radius: 18px;
  min-height: 296px;
  display: flex;
  align-items: center;
}

.hero:after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,#18132b 0%,#131223 29%,#121122dc 38%,transparent 65%);
  z-index: -1;
}
.hero-copy {
  padding: clamp(25px,3.3vw,48px);
  width: 59%;
}
.eyebrow,.category {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #c4a9ff;
  font-weight: 650;
  font-size: .71rem;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.eyebrow {
  padding: 4px 9px;
  border: 1px solid #8a67ca61;
  border-radius: 6px;
  background: #35244585;
}
.eyebrow svg {
  width: 15px;
  height: 15px;
}
.hero h1 {
  margin: 12px 0 10px;
  font-weight: 720;
}
.hero p {
  max-width: 510px;
  color: #b9b7ca;
  font-size: 1rem;
  line-height: 1.65;
}
.actions,.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 22px;
}
.primary,.secondary,.cardbtn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 630;
  font-size: .9rem;
  min-height: 42px;
}
.primary {
  background: linear-gradient(110deg,#8b60eb,#7552db);
  color: white;
  border: 1px solid #ad87f588;
  box-shadow: 0 3px 12px #7647c825;
}
.primary:hover {
  background: #9269ee;
}
.primary svg,.cardbtn svg {
  width: 15px;
  height: 15px;
}
.secondary {
  background: var(--raised);
  color: var(--txt);
  border: 1px solid var(--line);
}
.secondary:hover {
  border-color: var(--violet);
}
.hero .secondary {
  color: #e4deee;
  background: #292337b8;
  border-color: #494052;
}
.section {
  margin-top: 29px;
}
.section-head,.page-head,.modal-head,.between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.section-head {
  margin-bottom: 15px;
}
.section-head h2 {
  font-size: 1.59rem;
}
.count {
  margin-left: 9px;
  display: inline-block;
  color: var(--muted);
  font: 600 .8rem/1.65 ui-monospace,monospace;
  vertical-align: middle;
  text-align: center;
  min-width: 24px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 7px;
}
.quiet {
  font-size: .85rem;
  color: var(--muted);
  display: inline-flex;
  gap: 7px;
  align-items: center;
}
.quiet:hover {
  color: var(--violet);
}
.cards,.three {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 17px;
}
.gamecard,.panel,.stat {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
}
.gamecard {
  overflow: hidden;
  transition: border-color .2s,transform .2s;
  display: flex;
  flex-direction: column;
}
.gamecard:hover {
  border-color: color-mix(in srgb,var(--accent),var(--line) 42%);
  transform: translateY(-2px);
}
.stroop {
  --accent: #bd9bff;
  --wash: #322340;
  --edge: #6e498b;
}
.memory {
  --accent: #8cbfff;
  --wash: #182e48;
  --edge: #365a83;
}
.reaction {
  --accent: #78dfc2;
  --wash: #163b36;
  --edge: #306f60;
}
.visual {
  position: relative;
  height: clamp(132px,11.2vw,174px);
  background: var(--scene,#101018);
  overflow: hidden;
  isolation: isolate;
  border-bottom: 1px solid var(--line);
}
.visual:before {
  position: absolute;
  inset: 0;
  content: "";

}
.visual img {
  position: absolute;
  height: 125%;
  width: 64%;
  left: 21%;
  bottom: -10%;
  object-fit: contain;
  mix-blend-mode: screen;
}
.category {
  position: absolute;
  left: 15px;
  top: 13px;
  border: 1px solid color-mix(in srgb,var(--edge),transparent 25%);
  background: color-mix(in srgb,var(--wash),transparent 20%);
  border-radius: 20px;
  padding: 3px 8px;
  color: var(--accent);
  font-size: .69rem;
  letter-spacing: .02em;
  text-transform: none;
}
.category:before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}
.cardbody {
  padding: 17px 19px 15px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.cardbody p {
  font-size: .91rem;
  line-height: 1.55;
  margin: 7px 0 18px;
  max-width: 390px;
}
.cardfoot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  gap: 8px;
}
.meta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .79rem;
  color: var(--muted);
}
.cardbtn {
  border: 1px solid var(--edge);
  background: var(--wash);
  color: var(--accent);
  font-size: .85rem;
  min-height: 34px;
  padding: 6px 13px;
}
.cardbtn:hover {
  filter: brightness(1.2);
}
.stats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 13px;
}
.stat {
  padding: 15px 17px;
  display: flex;
  gap: 14px;
  align-items: center;
}
.stat-icon {
  height: 39px;
  width: 39px;
  flex: none;
  display: grid;
  place-items: center;
  background: var(--soft);
  color: var(--violet);
  border-radius: 11px;
}
.stat:nth-child(2) .stat-icon {
  color: #81baff;
  background: #1e3048;
}
.stat:nth-child(3) .stat-icon {
  color: #69d8bd;
  background: #16352f;
}
.stat:nth-child(4) .stat-icon {
  color: #f3bb80;
  background: #382c26;
}
.stat strong {
  font: 650 1.42rem/1.2 ui-monospace,monospace;
}
.stat small {
  display: block;
  color: var(--muted);
  font-size: .77rem;
  margin-top: 3px;
}
footer {
  padding: 15px 0 25px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .8rem;
}
footer b {
  padding: 0 5px;
}
.skip {
  position: fixed;
  left: -1000px;
}
.skip:focus {
  left: 8px;
  top: 8px;
  background: var(--panel);
  z-index: 10;
  padding: 8px;
}
.page-head {
  margin: 7px 0 24px;
  flex-wrap: wrap;
}
.page-head h1 {
  font-size: 2.15rem;
}
.page-head p,.panel>p,.stack p {
  margin-top: 7px;
}
.panel {
  padding: 22px;
}
.stack {
  display: grid;
  gap: 16px;
}
.panel h2 {
  font-size: 1.3rem;
}
.panel h3 {
  font-size: 1.1rem;
}
.subtle {
  font-size: .86rem;
  color: var(--muted);
}
.filters,.form-grid {
  display: flex;
  align-items: end;
  flex-wrap: wrap;
  gap: 14px;
}
.filters>label,.form-grid>label {
  flex: 1;
  min-width: min(165px,100%);

label,.label {
  display: block;
  color: var(--muted);

input,select {

select {

  background-size: 12px;
  background-position: right 12px center;
  background-repeat: no-repeat;
}
.tablewrap {

}
table {
  width: 100%;

.selected {

  color: var(--violet)!important;
}
dialog {

dialog::backdrop {

.modal-head {

.modal-head h2 {

dialog label,.field {

.seg {

.seg button {

  padding: 8px 5px;
  border-radius: 8px;
}
.note {

  background: var(--raised);
  border-radius: 9px;
  color: var(--muted);
  font-size: .86rem;
  margin-top: 16px;
}
.wide {
  width: 100%;
}
.close {
  font-size: 1.35rem;
  line-height: 1;
}
.game-zone {

.game-zone .panel {
  text-align: center;

.trialtop {

  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: .92rem;
}
.meter {
  height: 5px;
  border-radius: 8px;

  background: var(--raised);
  margin: 12px 0 20px;
}
.meter span {
  display: block;
  height: 100%;
  background: #9674f0;
}
.stage {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 19px;
}
.stimulus {
  font-size: clamp(2.6rem,7vw,5.4rem);
  font-weight: 750;
  line-height: 1.25;
  letter-spacing: -.03em;
}
.choices,.numbers {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.choices button,.numbers button {
  background: var(--raised);
  border: 1px solid var(--line);
  min-height: 49px;
  padding: 9px 15px;
  border-radius: 9px;
  font-weight: 650;
}
.choices button:hover,.numbers button:hover {
  border-color: var(--violet);
}
.numbers {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  width: min(320px,100%);
}
.sequence {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.sequence span {
  border-radius: 7px;
  background: var(--soft);
  padding: 5px 9px;
  color: var(--violet);
  font-weight: 700;
  font-size: 1.26rem;
}
.signal {
  width: 100%;
  min-height: 250px;
  border-radius: 12px;
  display: grid;
  place-content: center;
  gap: 12px;
  background: #7e2636;
  color: #fff;
  font-size: 1.65rem;
  font-weight: 650;
  touch-action: manipulation;
}
.signal.go {
  background: #15734c;
}
.signal small {
  font-size: .9rem;
  font-weight: 500;
}
.signal svg {
  width: 34px;
  height: 34px;
  margin: auto;
}
.chartrow {
  display: grid;
  grid-template-columns: minmax(120px,1fr) 3fr 50px;
  gap: 12px;
  align-items: center;
  margin: 12px 0;
  font-size: .9rem;
}
.track {
  background: var(--raised);
  border-radius: 10px;
  height: 11px;
  overflow: hidden;
}
.track i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg,#7550d6,#b399ff);
  border-radius: 10px;
}
.metric-table {
  margin-top: 15px;
}
.result-tag {
  color: var(--violet);
  font-size: .8rem;
}
.source {
  display: inline-block;
  margin-top: 14px;
  font-size: .84rem;
}
.science-card {
  border-top: 3px solid var(--edge);

.science-card h3 {
  margin: 5px 0 12px;
}
.science-card p {
  font-size: .94rem;
}
.science-card .label {
  color: var(--violet);
}
.steps {
  padding-left: 20px;
  color: var(--muted);
}
.steps li {
  padding: 4px 0;
}
.feedback {
  font-weight: 700;
  font-size: 1.15rem;
}
.error {
  color: #e97992;
}
#toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  border-radius: 10px;
  background: var(--raised);
  box-shadow: 0 4px 25px #0006;
  color: var(--txt);
  z-index: 20;
}
#toast:not(:empty) {
  padding: 10px 17px;
  border: 1px solid var(--line);
}
[hidden] {
  display: none!important;

  showModal('Тоглолтоос гарах уу?', '<p>Дуусаагүй тоглолтын үр дүн түүхэнд хадгалагдахгүй.</p><div class="actions">' + action('close', 'Тоглолтод үлдэх', '', 'secondary') + action('leave', 'Гарах') + '</div>');
}
const table = (head, rows) => '<div class="tablewrap"><table><thead><tr>' + head.map(t => '<th scope="col">' + t + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(v => '<td>' + v + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
function report(r) {
  if (!r) return home();
  const t = totals(r.trials),
    g = games[r.game];
  return '<div class="page-head"><div><div class="result-tag">Тоглолтын тайлан</div><h1>' + g.title + '</h1><p>' + safe(r.name) + ' · ' + levels[r.level] + ' · ' + date(r.at) + '</p></div><div class="choices">' + action('again', 'Дахин тоглох', 'play') + action('trialCSV', 'Тойргийн CSV', 'download', 'secondary') + '<button class="secondary" data-page="history">' + icon('history') + 'Түүх</button></div></div><div class="stack"><div class="stats">' + stat('trophy', fmt(scoreFor(r.trials)), 'Нийт оноо') + stat('target', t.accuracy + '%', 'Зөв хариулт') + stat('clock', ms(t.avg), 'Дундаж хугацаа') + stat('lab', (r.trials.reduce((a, b) => a + b.duration, 0) / 1000).toFixed(1) + ' с', 'Тойргуудын нийт хугацаа') + '</div><section class="panel"><h2>Тойрог бүрийн үр дүн</h2><p>' + t.correct + ' зөв · ' + (t.total - t.correct) + ' буруу · ' + r.trials.length + ' тойрог</p>' + table(['Тойрог', 'Өдөөгч', 'Зөв хариу', 'Таны хариу', 'Зөв / нийт', 'Дундаж хугацаа', 'Оноо'], r.trials.map((v, i) => [i + 1, safe(v.stimulus), safe(v.expected), safe(v.answer), v.correct + ' / ' + v.total, ms(v.timed ? v.sumMs / v.timed : null), v.points])) + '</section><section class="panel"><h2>Үр дүнг тайлбарлах нь</h2><p>' + g.measure + '</p><p>' + g.science + '</p><p class="note">Сургалт, туршилтын үр дүн. Эмнэлзүйн онош биш.</p></section></div>';
}
function filtered(rs) {
  return rs.filter(r => (filters.game === '' || r.game === filters.game) && (filters.level === '' || String(r.level) === filters.level) && (filters.name === '' || r.name === filters.name));
}
function filterPanel(rs) {
  return '<div class="panel filters"><label>Туршилт<select data-filter="game">' + opt('', 'Бүх туршилт', filters.game) + Object.entries(games).map(([k, g]) => opt(k, g.title, filters.game)).join('') + '</select></label><label>Түвшин<select data-filter="level">' + opt('', 'Бүх түвшин', filters.level) + levels.map((v, i) => opt(i, v, filters.level)).join('') + '</select></label><label>Оролцогч<select data-filter="name">' + opt('', 'Бүх оролцогч', filters.name) + [...new Set(rs.map(r => r.name))].sort().map(n => opt(n, n, filters.name)).join('') + '</select></label></div>';
}
function empty(hasData) {
  return '<div class="panel empty"><div class="stat-icon">' + icon('chart') + '</div><h3>' + (hasData ? 'Шүүлтэд тохирох тоглолт алга' : 'Эхний тоглолтоо эхлүүлээрэй') + '</h3><p>' + (hasData ? 'Өөр туршилт, түвшин эсвэл оролцогч сонгоно уу.' : 'Тоглолт дуусахад таны бодит үр дүн энд харагдана.') + '</p><div class="actions" style="justify-content:center">' + (hasData ? action('resetFilters', 'Шүүлт арилгах', '', 'secondary') : action('start', 'Туршилт эхлүүлэх', 'play')) + '</div></div>';
}
function historyTable(rs) {
  return '<section class="panel"><h2>Тоглолтын бүртгэл</h2>' + table(['Огноо', 'Оролцогч', 'Туршилт', 'Түвшин', 'Оноо', 'Зөв хувь', 'Дундаж хугацаа', 'Тайлан'], rs.map(r => {
    const t = totals(r.trials);
    return [date(r.at), safe(r.name), games[r.game].title, levels[r.level], scoreFor(r.trials), t.accuracy + '%', ms(t.avg), '<button data-report="' + safe(r.id) + '">Үзэх</button>'];
  })) + '</section>';
}
function charts(rs) {
  const groups = Object.entries(games).map(([k, g]) => ({
    g,
    rows: rs.filter(r => r.game === k)
  })).filter(x => x.rows.length);
  return '<section class="panel"><h2>Зөв хариултын хувь</h2><p class="subtle">Шүүсэн тоглолтуудын зөв хариултыг нийт хариултын тоонд харьцуулав.</p>' + groups.map(({
    g,
    rows
  }) => {
    const t = totals(rows.flatMap(r => r.trials));
    return '<div class="chartrow"><span>' + g.title + '</span><div class="track"><i style="width:' + t.accuracy + '%"></i></div><strong>' + t.accuracy + '%</strong></div>';
  }).join('') + '</section><section class="panel"><h2>Нэгтгэсэн статистик</h2>' + table(['Туршилт', 'Оролцогч', 'Тоглолт', 'Дундаж оноо', 'Зөв / нийт', 'Дундаж хугацаа'], groups.map(({
    g,
    rows
  }) => {
    const t = totals(rows.flatMap(r => r.trials));
    return [g.title, new Set(rows.map(r => r.name)).size, rows.length, (rows.reduce((a, r) => a + scoreFor(r.trials), 0) / rows.length).toFixed(1), t.correct + ' / ' + t.total, ms(t.avg)];
  })) + '<p class="subtle">Хугацааны дундаж нь хэмжигдсэн хариултуудаар жигнэгдэнэ. Тоглоом бүрийн хугацаа, оноог тухайн тоглоомын хүрээнд тайлбарлана.</p></section>';
}
function trendChart(rs, reference) {
  const recent = rs.filter(r => r.game === reference.game && r.level === reference.level).slice(0, 10).reverse();
  const points = recent.map(r => totals(r.trials).accuracy);
  const x = i => points.length === 1 ? 300 : 46 + i * 520 / (points.length - 1);
  const y = v => 113 - v * 0.93;
  const guides = [0, 50, 100].map(v => '<line x1="39" x2="580" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="34" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '%</text>').join('');
  const line = points.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const dots = points.map((v, i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5"><title>' + safe(recent[i].name) + ' · ' + date(recent[i].at) + ' · ' + v + '%</title></circle><text x="' + x(i) + '" y="135" text-anchor="middle">' + (i + 1) + '</text>').join('');
  return '<section class="panel"><h2>Гүйцэтгэлийн өөрчлөлт</h2><p class="subtle">' + games[reference.game].title + ' · ' + levels[reference.level] + ' · Сонгосон нөхцөл дэх сүүлийн ' + recent.length + ' тоглолтын зөв хувь, хуучнаас шинэ рүү.</p><svg class="trend" viewBox="0 0 600 145" role="img" aria-label="Зөв хувь дарааллаар ' + points.join('%, ') + '%">' + guides + '<polyline points="' + line + '"/>' + dots + '</svg><p class="subtle">Харьцуулалтын эхний тоглолтоор туршилт, түвшнийг сонгоно.</p></section>';
}
function comparison(rs) {
  const a = rs.find(r => r.id === compareIds[0]) || rs[0];
  const matches = rs.filter(r => r.id !== a.id && r.game === a.game && r.level === a.level);
  const b = matches.find(r => r.id === compareIds[1]) || matches[0];
  const describe = r => r.name + ' · ' + games[r.game].title + ' · ' + levels[r.level] + ' · ' + date(r.at) + ' · ' + scoreFor(r.trials) + ' оноо';
  const row = r => {
    const t = totals(r.trials);
    return [safe(r.name), date(r.at), scoreFor(r.trials), t.accuracy + '%', ms(t.avg)];
  };
  return '<section class="panel"><h2>Хоёр тоглолт харьцуулах</h2><p class="subtle">Ижил туршилт, ижил түвшний хоёр тоглолтыг сонгоно.</p><div class="form-grid"><label>Эхний тоглолт<select data-compare="0">' + rs.map(r => opt(r.id, describe(r), a.id)).join('') + '</select></label><label>Хоёр дахь тоглолт<select data-compare="1" ' + (!b ? 'disabled' : '') + '>' + (b ? matches.map(r => opt(r.id, describe(r), b.id)).join('') : '<option>Тохирох тоглолт алга</option>') + '</select></label></div>' + (b ? table(['Оролцогч', 'Огноо', 'Оноо', 'Зөв хувь', 'Дундаж хугацаа'], [row(a), row(b)]) : '<p class="note">Энэ түвшинд дахин тоглох эсвэл оролцогчийн шүүлтийг өргөжүүлж харьцуулалт үүсгээрэй.</p>') + '</section>' + trendChart(rs, a);
}
function dataPage(p) {
  const all = records(),
    rs = filtered(all),
    dash = p === 'dash';
  return '<div class="page-head"><div><h1>' + (dash ? 'Хяналтын самбар' : 'Тоглолтын түүх') + '</h1><p>' + (dash ? 'Оролцогчдын гүйцэтгэл, харьцуулсан үр дүн.' : 'Энэ хөтөчид бүртгэсэн тоглолт бүрийн тайлан.') + '</p></div><button class="secondary" data-act="export" ' + (!rs.length ? 'disabled' : '') + '>' + icon('download') + 'CSV татах</button></div><div class="stack">' + filterPanel(all) + (rs.length ? dash ? stats(rs) + charts(rs) + comparison(rs) : historyTable(rs) : empty(all.length > 0)) + '</div>';
}
function exportCSV() {
  const rs = filtered(records());
  if (!rs.length) return;
  const rows = [['Тоглолтын ID', 'Огноо (ISO 8601)', 'Оролцогч', 'Туршилт', 'Түвшин', 'Тойрог', 'Зөв', 'Нийт', 'Зөв хувь (%)', 'Дундаж хугацаа (мс)', 'Нийт оноо', 'Нийт хугацаа (мс)', 'Хугацаатай хариулт', 'Хугацааны нийлбэр (мс)']];
  for (const r of rs) {
    const t = totals(r.trials);
    rows.push([r.id, new Date(r.at).toISOString(), r.name, games[r.game].title, levels[r.level], r.trials.length, t.correct, t.total, (100 * t.correct / t.total).toFixed(2), t.avg === null ? '' : t.avg.toFixed(2), scoreFor(r.trials), Math.round(r.trials.reduce((a, v) => a + v.duration, 0)), r.trials.reduce((a, v) => a + v.timed, 0), r.trials.reduce((a, v) => a + v.sumMs, 0).toFixed(2)]);
  }
  downloadCSV(rows, 'Brain-Lab-' + new Date().toISOString().slice(0, 10) + '.csv');
  notify(rs.length + ' тоглолтыг CSV файлд бэлдлээ.');
}
function exportTrials() {
  const r = lastReport;
  if (!r) return;
  const rows = [['Тоглолтын ID', 'Оролцогч', 'Туршилт', 'Түвшин', 'Тойрог', 'Өдөөгч', 'Зөв хариу', 'Оролцогчийн хариу', 'Зөв', 'Нийт', 'Оноо', 'Хэмжигдсэн хариулт', 'Дундаж хугацаа (мс)', 'Тойргийн хугацаа (мс)']];
  r.trials.forEach((t, i) => rows.push([r.id, r.name, games[r.game].title, levels[r.level], i + 1, t.stimulus, t.expected, t.answer, t.correct, t.total, t.points, t.timed, t.timed ? (t.sumMs / t.timed).toFixed(2) : '', Math.round(t.duration)]));
  downloadCSV(rows, 'Brain-Lab-' + r.id + '.csv');
}
function downloadCSV(rows, filename) {
  const csvCell = v => {
    let s = String(v);
    if (typeof v === 'string' && /^\s*[=+@\-\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replaceAll('"', '""') + '"';
  };
  const blob = new Blob(['\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], {
    type: 'text/csv;charset=utf-8'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.id === 'theme') {
    theme = theme === 'dark' ? 'light' : 'dark';
    put('theme', theme);
    setTheme();
    return;
  }
  if (b.id === 'profile') {
    guard(() => {
      if (page === 'game') go('home');
      profile();
    });
    return;
  }
  if (b.dataset.page) {
    guard(() => go(b.dataset.page));
    return;
  }
  if (b.dataset.game) {
    setup(b.dataset.game);
    return;
  }
  if (b.dataset.level !== undefined) {
    setupLevel = Number(b.dataset.level);
    setupDetails();
    return;
  }
  if (b.dataset.color !== undefined) {
    answerColor(b.dataset.color);
    return;
  }
  if (b.dataset.num !== undefined) {
    answerNum(b.dataset.num);
    return;
  }
  if (b.id === 'signal') {
    if (e.detail === 0) reactionAnswer('press');
    return;
  }
  if (b.dataset.report) {
    lastReport = records().find(r => r.id === b.dataset.report);
    if (lastReport) go('report');
    return;
  }
  switch (b.dataset.act) {
    case 'start':
      setup();
      break;
    case 'help':
      help();
      break;
    case 'close':
      closeModal();
      break;
    case 'next':
    case 'resume':
      if (['paused', 'feedback'].includes(active?.phase)) nextTrial();
      break;
    case 'finish':
      finish();
      break;
    case 'exitGame':
      guard(() => go('home'));
      break;
    case 'leave':
      {
        const fn = pendingLeave;
        pendingLeave = null;
        clearClocks(active);
        active = null;
        closeModal();
        if (fn) fn();
        break;
      }
    case 'again':
      if (lastReport) setup(lastReport.game, lastReport.level);
      break;
    case 'export':
      exportCSV();
      break;
    case 'trialCSV':
      exportTrials();
      break;
    case 'resetFilters':
      filters = {
        game: '',
        name: '',
        level: ''
      };
      render();
      break;
  }
});
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#signal') && e.isPrimary && e.button === 0) reactionAnswer('press');
});
document.addEventListener('keydown', e => {
  if (!active || modal.open || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.code === 'Space' && ['wait', 'go'].includes(active.phase) && (!e.target.closest('button') || e.target.closest('#signal'))) {
    e.preventDefault();
    reactionAnswer('press');
  } else if (active.phase === 'recall' && /^[1-9]$/.test(e.key)) {
    e.preventDefault();
    answerNum(e.key);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'chooseGame') {
    setupGame = el.value;
    setupDetails();
  } else if (el.dataset.filter) {
    filters[el.dataset.filter] = el.value;
    render();
    document.querySelector('[data-filter="' + el.dataset.filter + '"]')?.focus();
  } else if (el.dataset.compare !== undefined) {
    compareIds[Number(el.dataset.compare)] = el.value;
    render();
    document.querySelector('[data-compare="' + el.dataset.compare + '"]')?.focus();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'playerName') e.target.setCustomValidity('');
});
document.addEventListener('submit', e => {
  if (!['setup', 'profileForm'].includes(e.target.id)) return;
  e.preventDefault();
  if (!readName()) return;
  if (e.target.id === 'setup') begin();else {
    closeModal();
    notify('Оролцогчийн код хадгалагдлаа.');
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && active) pauseGame();
});
window.addEventListener('storage', e => {
  if ((!e.key || e.key.startsWith(recordPrefix)) && !active && ['dash', 'history', 'home'].includes(page) && !modal.open) render();
});
render();
</script>
</body></html>
